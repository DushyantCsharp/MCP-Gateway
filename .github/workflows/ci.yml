name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.22"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format github .

  typecheck:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term --cov-fail-under=90
        env:
          CUSTOMS_REQUIRE_POSTGRES: "1"  # audit and approval tests use a Postgres container; never skip them
          CUSTOMS_REQUIRE_REDIS: "1"  # budget tests use a Redis container; never skip them either

  latency:
    name: Latency smoke
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # Shared runners are noisy: this catches gross regressions, not small ones.
      # The published numbers come from full runs on stated hardware (bench/results/).
      - run: uv run python bench/harness/latency.py --smoke --check 25

  demo:
    name: Demo stack end to end
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the stack
        run: docker compose -f demo/compose.yaml up --build --wait
      - name: Agent completes its task through the gateway
        run: docker compose -f demo/compose.yaml run --rm agent
      - name: The daily budget holds the second half of a split payment; a human denies it
        run: demo/scripts/held_call.sh split-payment deny 3
      - name: A large payment waits for a human through a gateway restart, then goes through
        run: demo/scripts/held_call.sh pay-invoice approve 0 --restart
      - name: Every call left a verifiable audit row
        run: docker compose -f demo/compose.yaml exec -T gateway customs verify-audit --key-env CUSTOMS_AUDIT_KEY
      - name: Every call left a trace in Jaeger
        run: python3 demo/scripts/check_traces.py
      - name: Stack logs
        if: failure()
        run: docker compose -f demo/compose.yaml logs
      - name: Tear down
        if: always()
        run: docker compose -f demo/compose.yaml down
