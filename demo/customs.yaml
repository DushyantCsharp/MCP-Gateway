# Gateway configuration for the demo Compose stack.
server:
  host: 0.0.0.0
  port: 8000

# Every request needs a bearer token. The demo's stand-in identity provider
# signs them with a shared secret; point jwks_url at a real issuer instead.
auth:
  jwt:
    audience: mcp-customs
    secret: ${CUSTOMS_JWT_SECRET}

stages:
  - type: policy            # decide on the real argument values first...
    file: policy.yaml
  - type: redaction         # ...then keep secrets (out) and personal data (back) from crossing
    mode: redact
    requests: [secrets]
    responses: [secrets, pii]
    allow: ['.*@acme\.example']
  - type: injection         # score what tools return before the agent reads it
    detector: hidden        # the cheap checks only; "layered" adds the classifier (740 MB model)
    mode: flag

# Every call, its decision and its outcome, hash-chained in Postgres.
# Verify with: docker compose -f demo/compose.yaml exec gateway customs verify-audit --key-env CUSTOMS_AUDIT_KEY
audit:
  dsn: ${CUSTOMS_AUDIT_DSN}
  chain: demo-gateway        # name each gateway replica; the default (host name) changes when a container is recreated
  key: ${CUSTOMS_AUDIT_KEY}

# Traces in Jaeger: http://localhost:16686
telemetry:
  otlp_endpoint: http://jaeger:4318

upstreams:
  workspace:
    url: http://workspace:8001/mcp
  finance:
    url: http://finance:8002/mcp
